name: Upload Russia Online runtime hotfix 1.1.15

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/upload-runtime-hotfix-115.yml

permissions:
  contents: write

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - name: Download encrypted transfer
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 4 --retry-all-errors             --output runtime-hotfix-115-transfer.zip             "https://rednode.pro/wp-content/uploads/2026/10/runtime-hotfix-115-transfer.zip"
          unzip -j runtime-hotfix-115-transfer.zip runtime-hotfix-115.rnpkg
          echo "0d9e08a247d1993616fd92333d0986d1bb3a8b6d9c507d6e8974b3f9cf955db9  runtime-hotfix-115.rnpkg" | sha256sum --check --strict

      - name: Upload release asset
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release upload assets-v12 runtime-hotfix-115.rnpkg             --repo "$GITHUB_REPOSITORY"             --clobber
